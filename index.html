<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishv Modi | Video Editor & Designer</title>
<meta name="description" content="Portfolio of Vishv Modi - Professional Video Editor and Thumbnail Designer.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
html{
scroll-behavior:smooth;
}

body{
font-family:'Inter',sans-serif;
background:#f8fafc;
color:#0f172a;
overflow-x:hidden;
}

/* reveal start state */
.reveal{
opacity:0;
transform:translateY(60px);
will-change:transform,opacity;
}

/* lightbox */
#lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
z-index:100;
align-items:center;
justify-content:center;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="fixed w-full z-50 bg-white/80 backdrop-blur border-b border-slate-200">
<div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center">
<span class="font-semibold">Vishv Modi</span>

<div class="hidden md:flex gap-8 text-sm text-slate-600">
<button onclick="scrollToSection('#work')" class="hover:text-slate-900">Work</button>
<button onclick="scrollToSection('#thumbnails')" class="hover:text-slate-900">Thumbnails</button>
<button onclick="scrollToSection('#contact')" class="text-indigo-600 font-medium">Contact</button>
</div>
</div>
</nav>

<!-- HERO -->
<header id="top" class="min-h-screen flex items-center pt-24">
<div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-16 items-center">

<div class="reveal">
<h1 class="text-5xl md:text-6xl font-bold mb-6">
Video Editor &<br>Thumbnail Designer
</h1>

<p class="text-slate-600 max-w-md mb-10">
I help creators and brands improve their videos with clean editing and strong thumbnails.
</p>

<button onclick="scrollToSection('#contact')" class="px-8 py-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
Start a Project
</button>
</div>

<div class="reveal">
<img src="hero.jpeg" alt="Vishv Modi" class="rounded-2xl w-full max-w-md mx-auto">
</div>

</div>
</header>

<!-- WORK -->
<section id="work" class="py-32">
<div class="max-w-7xl mx-auto px-8">

<h2 class="text-3xl font-semibold mb-12 reveal">Editing Example</h2>

<div class="grid md:grid-cols-2 gap-8">

<div class="rounded-xl overflow-hidden bg-slate-100 border reveal">
<p class="px-4 py-2 text-sm font-medium text-slate-700">Before</p>
<video autoplay muted loop playsinline class="w-full">
<source src="before.mp4" type="video/mp4">
</video>
</div>

<div class="rounded-xl overflow-hidden border reveal">
<p class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium">After</p>
<video autoplay muted loop playsinline class="w-full">
<source src="after.mp4" type="video/mp4">
</video>
</div>

</div>
</div>
</section>

<!-- THUMBNAILS -->
<section id="thumbnails" class="py-32 bg-white">
<div class="max-w-7xl mx-auto px-8 text-center">

<h2 class="text-3xl font-semibold mb-16 reveal">Thumbnail Work</h2>

<div class="grid md:grid-cols-3 gap-8">
<img src="thumb1.jpg" onclick="openLightbox('thumb1.jpg')" class="rounded-xl border cursor-pointer hover:scale-[1.02] transition reveal">
<img src="thumb2.jpg" onclick="openLightbox('thumb2.jpg')" class="rounded-xl border cursor-pointer hover:scale-[1.02] transition reveal">
<img src="thumb3.jpg" onclick="openLightbox('thumb3.jpg')" class="rounded-xl border cursor-pointer hover:scale-[1.02] transition reveal">
</div>

</div>
</section>

<!-- CONTACT -->
<section id="contact" class="py-32 text-center">

<h2 class="text-4xl font-bold mb-10 reveal">Contact Me</h2>

<div class="flex flex-col md:flex-row gap-6 justify-center">

<a href="mailto:mvishv6@gmail.com" class="px-8 py-4 border rounded-lg hover:bg-slate-100 reveal">
Email
</a>

<a href="https://www.instagram.com/vishvsfx?igsh=aTI1d2IzMmxxbGR4" target="_blank"
class="px-8 py-4 bg-slate-900 text-white rounded-lg hover:bg-slate-800 reveal">
Instagram
</a>

</div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()" class="flex">
<img id="lightbox-img" class="max-w-[90%] max-h-[90%] rounded-xl">
</div>

<script>
lucide.createIcons();

gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

/* reveal animation */
gsap.utils.toArray(".reveal").forEach(el=>{
gsap.fromTo(el,
{opacity:0,y:60},
{
opacity:1,
y:0,
duration:1,
ease:"power3.out",
scrollTrigger:{
trigger:el,
start:"top 85%",
toggleActions:"play reverse play reverse"
}
});
});

/* nav scroll */
function scrollToSection(id){
gsap.to(window,{
duration:1.2,
scrollTo:id,
ease:"power2.inOut"
});
}

/* lightbox */
function openLightbox(src){
document.getElementById("lightbox-img").src=src;
document.getElementById("lightbox").style.display="flex";
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
